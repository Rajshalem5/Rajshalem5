ateful LangGraph agents and cached speech</text><text x="814" y="196" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">cached vs fresh TTS</text></g><line x1="46" y1="210" x2="814" y2="210" stroke="#30363d" stroke-opacity=".6"/><g class="badge" style="animation-delay:0.28s"><text x="46" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Career Portal</text><text x="814" y="230" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#58a6ff">resume → score</text><text x="46" y="248" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="0.2" fill="#8b949e">Résumés in, structured profiles and AI scores out, matched to roles</text><text x="814" y="248" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">React · Flask · MySQL</text></g><line x1="46" y1="262" x2="814" y2="262" stroke="#30363d" stroke-opacity=".6"/><g class="badge" style="animation-delay:0.36s"><text x="46" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">AnySite</text><text x="814" y="282" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#58a6ff">problem → tools</text><text x="46" y="300" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="0.2" fill="#8b949e">A problem in, a tool sequence out — RAG recommendation workflow</text><text x="814" y="300" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">React · Flask · n8n</text></g>
