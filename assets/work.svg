<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="346" viewBox="0 0 860 346" role="img" aria-label="Work: AnthyOS cut pipeline runtime 16m22s to 10m32s and cost $1.26 to $0.22 a run; Ruchi serves cached speech in ~0 ms against ~1200 ms; Career Portal turns résumés into AI scores against roles; AnySite turns a problem into a tool sequence.">
