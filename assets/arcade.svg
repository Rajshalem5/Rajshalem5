<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="276" viewBox="0 0 860 276" role="img" aria-label="Arcade — four playable UI sets borrowed from finktheartist: pinball controls, pixel worlds, bubble wrap and a cockpit status display, all live on the site.">
